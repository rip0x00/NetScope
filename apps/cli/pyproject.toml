[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netscope-cli"
version = "0.1.0"
description = "NetScope command-line interface over the netscope-core diagnostic engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["netscope-core"]

[project.scripts]
netscope = "netscope_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
